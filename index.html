<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanessa Pilates - E-book Gratuito</title>
    <style>
        /* Estilos Gerais do Corpo da Página */
        body {
            margin: 0;
            padding: 20px 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* Gradiente em tons de roxo para combinar com a imagem fornecida */
            background: linear-gradient(135deg, #6a1b9a 0%, #4a148c 100%); 
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            box-sizing: border-box;
        }

        /* Caixa de Conteúdo Central */
        .container {
            background-color: #ffffff;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            max-width: 450px;
            width: 90%;
        }

        /* Estilização da Imagem da Profª Vanessa */
        .profile-img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            object-position: center 25%; /* Ajusta o foco para o rosto dela */
            border: 4px solid #ffd700; /* Borda dourada combinando com os balões */
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            margin-bottom: 20px;
        }

        /* Título Principal */
        h1 {
            color: #4a148c; /* Roxo escuro */
            font-size: 26px;
            margin-bottom: 10px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        /* Texto Descritivo */
        p {
            color: #444444;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* Botão de Download */
        .download-btn {
            background-color: #6a1b9a; /* Roxo principal */
            color: #ffffff;
            text-decoration: none;
            padding: 15px 35px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            display: inline-block;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 6px 20px rgba(106, 27, 154, 0.4);
        }

        /* Efeito ao passar o mouse no botão */
        .download-btn:hover {
            background-color: #4a148c;
            transform: translateY(-3px);
        }

        /* Rodapé */
        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #999999;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Puxa a imagem salva localmente com o nome vanessa.jpg -->
        <img src="vanessa.jpg" alt="Profª Vanessa de Andrade" class="profile-img">
        
        <h1>PARABÉNS, ALUNAS!</h1>
        <p>Você foi sorteada para receber o aplicativo de E-book totalmente gratuito da <strong>Profª Vanessa de Andrade</strong>.</p>
        
        <!-- Substitua o '#' pelo link real de download do app ou PDF -->
        <a href="#" class="download-btn" download>Fazer Download do App</a>
        
        <div class="footer">
            &copy; 2026 Vanessa Pilates. Todos os direitos reservados.
        </div>
    </div>

</body>
</html>

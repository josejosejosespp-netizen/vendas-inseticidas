<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanessa Pilates - E-book Gratuito</title>
    <style>
        /* Estilos Gerais e Fundo Texturizado */
        body {
            margin: 0;
            padding: 40px 0;
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f7f5f2;
            /* Recria o padrão geométrico sutil de fundo do modelo */
            background-image: 
                linear-gradient(30deg, #eae6e1 12%, transparent 12.5%, transparent 87%, #eae6e1 87.5%, #eae6e1),
                linear-gradient(150deg, #eae6e1 12%, transparent 12.5%, transparent 87%, #eae6e1 87.5%, #eae6e1),
                linear-gradient(30deg, #eae6e1 12%, transparent 12.5%, transparent 87%, #eae6e1 87.5%, #eae6e1),
                linear-gradient(150deg, #eae6e1 12%, transparent 12.5%, transparent 87%, #eae6e1 87.5%, #eae6e1),
                linear-gradient(60deg, #f2eee9 25%, transparent 25.5%, transparent 75%, #f2eee9 75.5%, #f2eee9),
                linear-gradient(60deg, #f2eee9 25%, transparent 25.5%, transparent 75%, #f2eee9 75.5%, #f2eee9);
            background-size: 40px 70px;
            background-position: 0 0, 0 0, 20px 35px, 20px 35px, 0 0, 20px 35px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
        }

        /* Container Principal do Site */
        .card {
            background-color: #ffffff;
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            border: 1px solid rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        /* Cabeçalho com o Gradiente Rose Gold / Dourado */
        .card-header {
            background: linear-gradient(180deg, #e5cfc1 0%, #ecdccf 45%, #ffffff 100%);
            padding: 35px 20px 10px 20px;
        }

        /* Logo Vanessa Pilates */
        .brand-title {
            font-size: 32px;
            color: #333333;
            margin: 0;
            font-weight: 400;
            letter-spacing: 0.5px;
        }
        
        .brand-title strong {
            font-weight: 700;
        }

        /* Ícone Sutil de Pilates integrado ao texto */
        .brand-logo-icon {
            display: inline-block;
            font-size: 24px;
            vertical-align: middle;
            margin: 0 -2px;
        }

        .brand-subtitle {
            font-size: 16px;
            color: #444444;
            margin: 5px 0 0 0;
            font-weight: 500;
        }

        /* Área da Imagem Perfeita */
        .image-container {
            position: relative;
            margin: 20px auto 35px auto;
            width: 180px;
            height: 180px;
        }

        /* Moldura de Foto Idêntica ao Modelo */
        .profile-frame {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            border: 4px solid #ccaf86; /* Tom dourado refinado */
            box-shadow: 0 8px 20px rgba(204, 175, 134, 0.25);
            background-color: #f7f5f2;
        }

        /* Puxa a imagem original cortando exatamente no rosto */
        .profile-frame img {
            width: 190%;
            height: 190%;
            object-fit: cover;
            /* Faz o zoom milimétrico na face da Vanessa de Andrade */
            object-position: 63% 36%; 
            display: block;
        }

        /* Tag com o Nome sobreposta abaixo da foto */
        .name-tag {
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(180deg, #d3bba2 0%, #bca38a 100%);
            color: #111111;
            padding: 6px 18px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            white-space: nowrap;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            border: 1px solid #c5ae96;
        }

        /* Corpo de Texto */
        .card-body {
            padding: 0 35px 25px 35px;
        }

        .announcement {
            color: #555555;
            font-size: 17px;
            line-height: 1.6;
            margin: 0 0 25px 0;
            font-weight: 400;
        }

        .announcement strong {
            color: #000000;
            display: block;
            font-size: 19px;
            margin-top: 8px;
            font-weight: 700;
        }

        /* Botão Arredondado em Tom Vinho/Marsala Premium */
        .btn-download {
            background: linear-gradient(180deg, #9b445d 0%, #803348 100%);
            color: #ffffff;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 40px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 50px;
            box-shadow: 0 8px 25px rgba(155, 68, 93, 0.35);
            transition: all 0.3s ease;
            border: 1px solid #752d41;
            margin-bottom: 25px;
        }

        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(155, 68, 93, 0.45);
            background: linear-gradient(180deg, #ad4d6a 0%, #8a374c 100%);
        }

        /* Ícone Nuvem de Download */
        .icon-cloud {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        /* Rodapé interno do Card */
        .card-footer {
            background: linear-gradient(180deg, #ffffff 0%, #ecdccf 100%);
            padding: 20px 20px;
            border-top: 1px solid rgba(0, 0, 0, 0.02);
        }

        /* Ícones Sociais (Instagram e Facebook) */
        .social-links {
            margin-bottom: 12px;
        }

        .social-icon {
            display: inline-block;
            margin: 0 8px;
            color: #333333;
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .social-icon:hover {
            opacity: 0.7;
        }

        .social-icon svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
            vertical-align: middle;
        }

        .copyright {
            font-size: 11px;
            color: #666666;
            margin: 0;
        }
    </style>
</head>
<body>

        <div class="image-container">

            </div>
            <p class="copyright">&copy; 2026 Vanessa Pilates. Todos os direitos reservados.</p>
        </div>
    </div>

</body>
</html>

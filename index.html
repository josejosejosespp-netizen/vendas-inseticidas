<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Sampa Repasse | Cadastro de Parceiros</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* Reset e Configurações Básicas */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: #1f2937;
        }

        /* Container Principal */
        .container {
            width: 100%;
            max-width: 550px;
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            border-top: 6px solid #D31225; /* Vermelho Automotivo */
        }

        /* Cabeçalho do Formulário */
        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h2 {
            color: #111827;
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: -0.5px;
        }

        .header h2 span {
            color: #D31225;
        }

        .header p {
            color: #6b7280;
            font-size: 15px;
        }

        /* Alerta de Bônus */
        .bonus-badge {
            background: #fffbeb;
            color: #b45309;
            border: 1px solid #fde68a;
            padding: 12px;
            text-align: center;
            font-weight: 600;
            font-size: 14px;
            border-radius: 8px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* Elementos de Formulário */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }

        /* CSS que estava cortado agora finalizado */
        input, select {
            width: 100%;
            padding: 12px 16px;
            font-size: 15px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            background-color: #f9fafb;
            color: #111827;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            border-color: #D31225;
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(211, 18, 37, 0.1);
        }

        input::placeholder {
            color: #9ca3af;
        }

        /* Botão de Envio */
        .submit-btn {
            width: 100%;
            background-color: #D31225;
            color: #ffffff;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background-color: #b90f1f;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        /* Rodapé do Formulário */
        .footer-text {
            text-align: center;
            margin-top: 20px;
            font-size: 12px;
            color: #9ca3af;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Cabeçalho -->
        <div class="header">
            <h2>Auto Sampa <span>Repasse</span></h2>
            <p>Faça seu cadastro e acesse nosso estoque exclusivo com preços de repasse.</p>
        </div>

        <!-- Alerta/Bônus -->
        <div class="bonus-badge">
            🚗 Oportunidades diárias exclusivas para parceiros cadastrados!
        </div>

        <!-- Formulário -->
        <form action="#" method="POST">
            
            <div class="form-group">
                <label for="nome">Nome Completo / Razão Social</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome ou o da loja" required>
            </div>

            <div class="form-group">
                <label for="whatsapp">WhatsApp</label>
                <input type="tel" id="whatsapp" name="whatsapp" placeholder="(11) 99999-9999" required>
            </div>

            <div class="form-group">
                <label for="tipo">Qual o seu perfil?</label>
                <select id="tipo" name="tipo" required>
                    <option value="" disabled selected>Selecione uma opção...</option>
                    <option value="lojista">Lojista (Agência/Concessionária)</option>
                    <option value="repassador">Repassador Independente</option>
                    <option value="particular">Comprador Particular</option>
                </select>
            </div>

            <div class="form-group">
                <label for="documento">CNPJ ou CPF</label>
                <input type="text" id="documento" name="documento" placeholder="00.000.000/0000-00" required>
            </div>

            <button type="submit" class="submit-btn">Acessar Estoque Agora</button>

        </form>

        <p class="footer-text">Seus dados estão seguros. Não enviamos spam.</p>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulte seu Cashback — Análise de Linha de Crédito</title>
    <style>
        :root {
            --primary: #0f172a;
            --accent: #059669;
            --accent-hover: #047857;
            --slate-100: #f1f5f9;
            --slate-300: #cbd5e1;
            --slate-600: #475569;
            --slate-800: #1e293b;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
        }

        body { 
            background: radial-gradient(circle at top, #f8fafc 0%, #e2e8f0 100%); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 24px; 
        }

        .container { 
            background: #ffffff; 
            padding: 40px 32px; 
            border-radius: 20px; 
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.02); 
            max-width: 480px; 
            width: 100%; 
            border: 1px solid rgba(0, 0, 0, 0.03);
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        h2 { 
            color: var(--primary); 
            margin-bottom: 8px; 
            font-size: 26px; 
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        p { 
            color: var(--slate-600); 
            font-size: 14px; 
            line-height: 1.6; 
        }

        .form-group { 
            margin-bottom: 20px; 
        }

        label { 
            display: block; 
            margin-bottom: 8px; 
            color: var(--slate-800); 
            font-weight: 600; 
            font-size: 13px; 
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input { 
            width: 100%; 
            padding: 14px 16px; 
            border: 1px solid var(--slate-300); 
            border-radius: 10px; 
            font-size: 15px; 
            color: var(--primary);
            background-color: #fbfbfb;
            transition: all 0.2s ease-in-out; 
        }

        input::placeholder {
            color: #94a3b8;
        }

        input:focus { 
            outline: none; 
            border-color: var(--accent); 
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(5, 150, 105, 0.15); 
        }

        button { 
            width: 100%; 
            background: var(--accent); 
            color: white; 
            border: none; 
            padding: 16px; 
            border-radius: 10px; 
            font-size: 16px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: all 0.2s ease; 
            margin-top: 12px; 
            box-shadow: 0 4px 6px -1px rgba(5, 150, 105, 0.2);
        }

        button:hover { 
            background: var(--accent-hover); 
            transform: translateY(-1px);
            box-shadow: 0 10px 15px -3px rgba(5, 150, 105, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: var(--slate-300);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .footer { 
            text-align: center; 
            margin-top: 28px; 
            font-size: 12px; 
            color: #94a3b8; 
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Consulte seu Cashback</h2>
        <p>Insira os dados da empresa ou titular para realizarmos a análise cadastral da sua máquina e calcular o teto de resgate.</p>
    </div>
    
    <form id="cashbackForm">
        <div class="form-group">
            <label for="nome">Nome Completo / Razão Social</label>
            <input type="text" id="nome" placeholder
